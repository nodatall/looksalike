inherit_gem: { rubocop-rails-omakase: rubocop.yml }

AllCops:
  CacheRootDirectory: tmp/rubocop_cache
  Exclude:
    - "tasks/**/*"
    - "node_modules/**/*"
    - "vendor/**/*"
    - "tmp/**/*"
    - "storage/**/*"
    - "public/assets/**/*"
    - "app/assets/builds/**/*"
    - "agent-scratch/**/*"
